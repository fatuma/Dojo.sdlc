[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mars-rover"
version = "0.1.0"
description = "Simulateur Mars Rover exposé via l'API POST /simulations"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mars_rover"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
